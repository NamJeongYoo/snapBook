server:
  port: 8080

spring:
  application:
    name: snapbook

  datasource:
    url: jdbc:postgresql://localhost:5432/snapbook
    username: snapbook
    password: snapbook123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: snapbook-reservation-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.interstellar.snapbook.kafka"

logging:
  level:
    root: INFO
    com.interstellar.snapbook: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO

# Custom application properties
app:
  queue:
    batch-size: 100
    allow-interval-ms: 1000
  kafka:
    topic:
      reservation: reservation-events
